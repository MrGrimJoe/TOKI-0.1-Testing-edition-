[pytest]
addopts = -m "not disruptive"
markers =
    requires_windows: needs a real Windows desktop (PowerShell, Get-StartApps, UI Automation) to actually execute -- skipped automatically everywhere else, runs for real the first time this suite is run on Windows.
    requires_browser: needs a real Chrome/Edge binary (media_browser.py's dedicated CDP-debug browser) -- skipped automatically if no such browser is found.
    requires_app_control: needs pywinauto + a real focusable window (e.g. Notepad) on top of requires_windows -- kept as a separate mark so a future session can selectively run/skip just the click/type-target tests.
    disruptive: does something disruptive to the real machine it runs on (locks the screen, empties the real Recycle Bin) -- EXCLUDED BY DEFAULT via addopts above. Run explicitly and only when ready: `pytest -m disruptive --override-ini="addopts="`.
